services:
  - type: web
    name: pix-backend
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: pix-backend
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: πX Technologies
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://pix-technologies.pixtech.workers.dev,https://pix.com,https://www.pix.com
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "100"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
